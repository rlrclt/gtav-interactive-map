<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GTA V Interactive Map</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Top Navigation / Controls Bar -->
  <header class="map-header">
    <div class="brand">
      <div class="brand-badge">GTA V</div>
      <span class="brand-title">Los Santos & Blaine County</span>
      <div class="sync-badge" id="sync-status-badge" title="สถานะการเชื่อมต่อกับเพื่อน">
        <span class="sync-dot"></span>
        <span class="sync-text">ออนไลน์</span>
      </div>
    </div>

    <!-- Map Style Switcher -->
    <div class="style-selector" role="radiogroup" aria-label="Map Style">
      <button type="button" class="style-btn active" data-style="atlas">
        <span class="btn-dot"></span>Atlas
      </button>
      <button type="button" class="style-btn" data-style="satelite">
        <span class="btn-dot"></span>Satellite
      </button>
      <button type="button" class="style-btn" data-style="grid">
        <span class="btn-dot"></span>Grid
      </button>
    </div>
  </header>

  <!-- Quick Floating Controls (Bottom Right) -->
  <div class="floating-controls">
    <button type="button" class="control-btn" id="btn-recenter" title="จัดกึ่งกลางแผนที่" aria-label="จัดกึ่งกลาง">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="3"></circle>
        <line x1="12" y1="2" x2="12" y2="5"></line>
        <line x1="12" y1="19" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="5" y2="12"></line>
        <line x1="19" y1="12" x2="22" y2="12"></line>
      </svg>
    </button>
    <button type="button" class="control-btn" id="btn-zoom-in" title="ซูมเข้า" aria-label="ซูมเข้า">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button type="button" class="control-btn" id="btn-zoom-out" title="ซูมออก" aria-label="ซูมออก">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- Modal / Dialog for New Marker -->
  <div class="marker-modal-backdrop" id="marker-modal">
    <div class="marker-modal-card">
      <div class="modal-header">
        <h3 id="modal-title">📍 เพิ่มจุดมาร์คใหม่</h3>
        <button type="button" class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <form id="marker-form">
        <div class="form-group">
          <label for="marker-name">ชื่อจุดมาร์ค</label>
          <input type="text" id="marker-name" placeholder="เช่น กล่องแอร์ดรอป, ร้านค้า, จุดฟาร์ม" required autocomplete="off" maxlength="30">
        </div>

        <div class="form-group">
          <div class="timers-header">
            <label>รายการตัวนับเวลาในจุดนี้</label>
            <button type="button" class="btn-add-timer-row" id="btn-add-timer-row">+ เพิ่มตัวนับเวลา</button>
          </div>
          <div class="timers-container" id="timers-container">
            <!-- Dynamic Timer Rows will be inserted here -->
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="btn-cancel-marker">ยกเลิก</button>
          <button type="submit" class="btn-confirm" id="btn-create-marker">เริ่มนับถอยหลัง</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Coordinate / Zoom Status Info -->
  <footer class="map-footer">
    <div class="coord-info" id="coord-display">
      <span>พิกัด:</span> <strong id="coord-val">X: 4096 | Y: 4096</strong>
    </div>
    <div class="zoom-info" id="zoom-display">
      <span>ระดับซูม:</span> <strong id="zoom-val">1.0x</strong>
    </div>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
